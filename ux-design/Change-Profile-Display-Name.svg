<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, Arial, Helvetica, sans-serif">
  <!-- Frame background -->
  <rect x="0" y="0" width="375" height="812" fill="#FFFFFF"/>

  <!-- Status bar -->
  <text x="33" y="28" font-size="16" font-weight="600" fill="#000000">10:06</text>

  <!-- App bar -->
  <text x="187.5" y="76" font-size="17" font-weight="700" fill="#1A1A1A" text-anchor="middle">Profile</text>
  <rect x="271" y="58" width="88" height="28" fill="#E5E5E5"/>
  <text x="315" y="76" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">1,240 coins</text>
  <line x1="0" y1="96" x2="375" y2="96" stroke="#D9D9D9" stroke-width="1"/>

  <!-- Profile header -->
  <rect x="139.5" y="120" width="96" height="96" fill="#D9D9D9"/>
  <text x="187.5" y="172" font-size="11" fill="#666666" text-anchor="middle">user photo</text>
  <text x="187.5" y="248" font-size="20" font-weight="700" fill="#1A1A1A" text-anchor="middle">Jane Doe</text>
  <text x="187.5" y="270" font-size="13" fill="#757575" text-anchor="middle">jane.doe@gmail.com</text>

  <!-- Display name -->
  <text x="16" y="320" font-size="14" font-weight="600" fill="#1A1A1A">Display name</text>
  <rect x="16" y="332" width="343" height="48" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="32" y="362" font-size="16" fill="#1A1A1A">Jane Doe</text>
  <text x="16" y="400" font-size="12" fill="#757575">Shown to friends in groups and on leaderboards.</text>

  <!-- Primary button -->
  <rect x="16" y="420" width="343" height="52" fill="#4D4D4D"/>
  <text x="187.5" y="452" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Save Changes</text>

  <!-- Log out -->
  <line x1="16" y1="504" x2="359" y2="504" stroke="#D9D9D9" stroke-width="1"/>
  <rect x="16" y="528" width="343" height="52" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.5"/>
  <text x="187.5" y="560" font-size="16" font-weight="700" fill="#1A1A1A" text-anchor="middle">Log Out</text>

  <!-- Bottom navigation -->
  <line x1="0" y1="728" x2="375" y2="728" stroke="#D9D9D9" stroke-width="1"/>
  <rect x="35" y="744" width="24" height="24" fill="#D9D9D9"/>
  <text x="47" y="786" font-size="11" fill="#757575" text-anchor="middle">Groups</text>
  <rect x="129" y="744" width="24" height="24" fill="#D9D9D9"/>
  <text x="141" y="786" font-size="11" fill="#757575" text-anchor="middle">My Bets</text>
  <rect x="222" y="744" width="24" height="24" fill="#D9D9D9"/>
  <text x="234" y="786" font-size="11" fill="#757575" text-anchor="middle">Leaderboard</text>
  <rect x="316" y="744" width="24" height="24" fill="#4D4D4D"/>
  <text x="328" y="786" font-size="11" font-weight="700" fill="#1A1A1A" text-anchor="middle">Profile</text>
</svg>
