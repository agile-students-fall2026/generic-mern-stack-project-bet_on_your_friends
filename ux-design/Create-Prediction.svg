<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, Arial, Helvetica, sans-serif">
  <!-- Frame background -->
  <rect x="0" y="0" width="375" height="812" fill="#FFFFFF"/>

  <!-- Status bar -->
  <text x="33" y="28" font-size="16" font-weight="600" fill="#000000">10:06</text>

  <!-- App bar -->
  <text x="16" y="76" font-size="15" fill="#1A1A1A">‹ Back</text>
  <text x="187.5" y="76" font-size="17" font-weight="700" fill="#1A1A1A" text-anchor="middle">New Prediction</text>
  <rect x="271" y="58" width="88" height="28" fill="#E5E5E5"/>
  <text x="315" y="76" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">1,240 coins</text>
  <line x1="0" y1="96" x2="375" y2="96" stroke="#D9D9D9" stroke-width="1"/>

  <!-- Group context -->
  <text x="16" y="126" font-size="12" fill="#757575">Posting to NYU Roommates</text>

  <!-- Question -->
  <text x="16" y="158" font-size="14" font-weight="600" fill="#1A1A1A">Question</text>
  <rect x="16" y="170" width="343" height="76" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="32" y="198" font-size="16" fill="#1A1A1A">Will Sam go to the gym 10</text>
  <text x="32" y="220" font-size="16" fill="#1A1A1A">times in October?</text>
  <text x="343" y="238" font-size="11" fill="#9E9E9E" text-anchor="end">43/120</text>

  <!-- Outcomes -->
  <text x="16" y="284" font-size="14" font-weight="600" fill="#1A1A1A">Outcomes</text>
  <text x="359" y="284" font-size="12" fill="#757575" text-anchor="end">At least 2</text>
  <rect x="16" y="296" width="343" height="48" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="32" y="326" font-size="16" fill="#1A1A1A">Yes</text>
  <rect x="16" y="356" width="343" height="48" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="32" y="386" font-size="16" fill="#1A1A1A">No</text>
  <rect x="16" y="416" width="343" height="44" fill="#FFFFFF" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="187.5" y="443" font-size="14" font-weight="600" fill="#4D4D4D" text-anchor="middle">+ Add outcome</text>

  <!-- Betting deadline -->
  <text x="16" y="498" font-size="14" font-weight="600" fill="#1A1A1A">Betting deadline</text>
  <rect x="16" y="510" width="200" height="48" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="32" y="540" font-size="16" fill="#1A1A1A">Oct 31, 2026</text>
  <rect x="228" y="510" width="131" height="48" fill="#FFFFFF" stroke="#999999" stroke-width="1"/>
  <text x="244" y="540" font-size="16" fill="#1A1A1A">11:59 PM</text>
  <text x="16" y="578" font-size="12" fill="#757575">No bets can be placed after this time.</text>

  <!-- Primary button -->
  <rect x="16" y="600" width="343" height="52" fill="#4D4D4D"/>
  <text x="187.5" y="632" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Post Prediction</text>

  <!-- Bottom navigation -->
  <line x1="0" y1="728" x2="375" y2="728" stroke="#D9D9D9" stroke-width="1"/>
  <rect x="35" y="744" width="24" height="24" fill="#4D4D4D"/>
  <text x="47" y="786" font-size="11" font-weight="700" fill="#1A1A1A" text-anchor="middle">Groups</text>
  <rect x="129" y="744" width="24" height="24" fill="#D9D9D9"/>
  <text x="141" y="786" font-size="11" fill="#757575" text-anchor="middle">My Bets</text>
  <rect x="222" y="744" width="24" height="24" fill="#D9D9D9"/>
  <text x="234" y="786" font-size="11" fill="#757575" text-anchor="middle">Leaderboard</text>
  <rect x="316" y="744" width="24" height="24" fill="#D9D9D9"/>
  <text x="328" y="786" font-size="11" fill="#757575" text-anchor="middle">Profile</text>
</svg>
