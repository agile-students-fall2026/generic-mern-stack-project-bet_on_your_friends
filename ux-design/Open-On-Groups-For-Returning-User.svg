<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" font-family="Inter, Arial, Helvetica, sans-serif">
  <!-- Frame background -->
  <rect x="0" y="0" width="375" height="812" fill="#FFFFFF"/>

  <!-- Status bar -->
  <text x="33" y="28" font-size="16" font-weight="600" fill="#000000">10:06</text>

  <!-- App bar -->
  <text x="187.5" y="76" font-size="17" font-weight="700" fill="#1A1A1A" text-anchor="middle">My Groups</text>
  <rect x="271" y="58" width="88" height="28" fill="#E5E5E5"/>
  <text x="315" y="76" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">1,000 coins</text>
  <line x1="0" y1="96" x2="375" y2="96" stroke="#D9D9D9" stroke-width="1"/>

  <!-- Welcome banner -->
  <rect x="16" y="112" width="343" height="76" fill="#F2F2F2" stroke="#CCCCCC" stroke-width="1"/>
  <text x="32" y="140" font-size="15" font-weight="700" fill="#1A1A1A">Welcome, Jane!</text>
  <text x="343" y="140" font-size="12" fill="#757575" text-anchor="end">Dismiss</text>
  <text x="32" y="164" font-size="13" fill="#1A1A1A">You start with 1,000 coins to bet with.</text>

  <!-- Groups list -->
  <text x="16" y="228" font-size="15" font-weight="700" fill="#1A1A1A">Your groups</text>
  <text x="359" y="228" font-size="12" fill="#757575" text-anchor="end">2 groups</text>
  <rect x="16" y="244" width="343" height="80" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="32" y="260" width="48" height="48" fill="#D9D9D9"/>
  <text x="56" y="282" font-size="8" fill="#666666" text-anchor="middle">group</text>
  <text x="56" y="292" font-size="8" fill="#666666" text-anchor="middle">photo</text>
  <text x="92" y="280" font-size="16" font-weight="700" fill="#1A1A1A">NYU Roommates</text>
  <text x="92" y="300" font-size="12" fill="#757575">6 members · 3 open predictions</text>
  <text x="343" y="291" font-size="22" fill="#9E9E9E" text-anchor="end">›</text>

  <rect x="16" y="336" width="343" height="80" fill="#FFFFFF" stroke="#BBBBBB" stroke-width="1"/>
  <rect x="32" y="352" width="48" height="48" fill="#D9D9D9"/>
  <text x="56" y="374" font-size="8" fill="#666666" text-anchor="middle">group</text>
  <text x="56" y="384" font-size="8" fill="#666666" text-anchor="middle">photo</text>
  <text x="92" y="372" font-size="16" font-weight="700" fill="#1A1A1A">CS Study Group</text>
  <text x="92" y="392" font-size="12" fill="#757575">4 members · 1 open prediction</text>
  <text x="343" y="383" font-size="22" fill="#9E9E9E" text-anchor="end">›</text>

  <rect x="16" y="428" width="343" height="48" fill="#FFFFFF" stroke="#999999" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="187.5" y="457" font-size="14" font-weight="600" fill="#4D4D4D" text-anchor="middle">+ Create a group</text>

  <!-- Bottom navigation -->
  <line x1="0" y1="728" x2="375" y2="728" stroke="#D9D9D9" stroke-width="1"/>
  <rect x="35" y="744" width="24" height="24" fill="#4D4D4D"/>
  <text x="47" y="786" font-size="11" font-weight="700" fill="#1A1A1A" text-anchor="middle">Groups</text>
  <rect x="129" y="744" width="24" height="24" fill="#D9D9D9"/>
  <text x="141" y="786" font-size="11" fill="#757575" text-anchor="middle">My Bets</text>
  <rect x="222" y="744" width="24" height="24" fill="#D9D9D9"/>
  <text x="234" y="786" font-size="11" fill="#757575" text-anchor="middle">Leaderboard</text>
  <rect x="316" y="744" width="24" height="24" fill="#D9D9D9"/>
  <text x="328" y="786" font-size="11" fill="#757575" text-anchor="middle">Profile</text>
</svg>
